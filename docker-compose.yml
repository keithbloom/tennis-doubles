services:
  web:
    image: tennis-tournament-app:latest
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./local_data:/code/data
    environment:
      - SQLITE_DB_PATH=/code/data/local_db.sqlite3
      - DEBUG=True
    command: sh -c "python manage.py migrate && gunicorn --bind :8000 --workers 2 tennis_doubles.wsgi:application"
